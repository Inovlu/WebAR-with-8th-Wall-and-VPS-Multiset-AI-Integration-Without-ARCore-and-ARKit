<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XR8 — 8th Wall Engine (test)</title>


  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { overflow-x: hidden; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── Landing ── */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    .emoji { font-size: 56px; }
    h1 { font-size: 22px; font-weight: 700; }
    p  { font-size: 14px; color: #888; line-height: 1.6; max-width: 320px; }

    button {
      width: 100%;
      max-width: 320px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.7; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-start-ar {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      color: #fff;
    }

    /* ── HUD during AR: manual localization button ── */
    #hud {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #btn-localize, #cube-scale-slider {
      width: 220px;
    }
    #btn-localize {
      background: #fff;
      color: #111;
    }
    #cube-scale-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 220px;
      gap: 4px;
    }
    #cube-scale-container label {
      font-size: 12px;
      font-weight: 600;
    }

    /* ── Status text during AR ── */
    #status-text {
      display: none;
      position: fixed;
      top: 20px; left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
    }

    /* ── Badge: MultiSet recognized the map ── */
    #confidence-badge {
      display: none;
      position: fixed;
      top: 20px; right: 16px;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      backdrop-filter: blur(8px);
      color: #06d6a0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    /* ── Test button: toggle camera/AR ↔ 3D viewer ── */
    #btn-debug-toggle-view {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      width: auto;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }


    /* ── Fallback: device without stable tracking → 3D view without AR ── */
    #fallback-viewer {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: #0a0a0a;
    }
    #fallback-canvas {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      border-radius: 16px;
      background: #131313;
    }
    #btn-fallback-back {
      background: rgba(255,255,255,0.12);
      color: #fff;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <!-- Canvas where XR8 and Three.js will draw the camera and scene -->
  <canvas id="camerafeed" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;"></canvas>

  <!-- Initial screen -->
  <div id="landing">
    <div class="emoji">🧪</div>
    <h1>XR8 — 8th Wall Engine</h1>
    <p>Minimal test of 8th Wall's own engine (no WebXR). Tap the button to start and confirm that the cube appears fixed and stable.</p>
    <button id="btn-start-ar">Start AR</button>
  </div>

  <div id="status-text"></div>

  <!-- Turns on only when MultiSet returns poseFound:true — visible confirmation that it recognized the map -->
  <div id="confidence-badge"></div>

  <!-- HUD during AR: manual localization + pause of automatic background relocalization (every N seconds) -->
  <div id="hud">
    <button id="btn-localize">📍 Localize</button>
    <div id="cube-scale-container">
      <label for="cube-scale-slider">Cube Scale</label>
      <input type="range" id="cube-scale-slider" min="0.1" max="5.0" step="0.1" value="1" />
    </div>
  </div>

  <!--
    TEST button: manually toggles between the camera/AR view and the
    3D fallback viewer, without depending on the automatic fallback
    triggering. Unlike triggerFallback() (which pauses XR8 and releases
    the camera permanently, because resuming an already-paused session
    isn't reliable — see comment next to btnFallbackBack), this toggle
    does NOT touch the XR8 engine or the camera: it only changes which
    container is visible. This makes it instant and reversible as many
    times as needed, useful for visually comparing how the cube would
    look in the 3D viewer vs. whether it appears (or not) in the real
    camera view, without having to reload the page between attempts.
    It's hidden only if the automatic fallback truly fires (at that
    point there's no live camera to go back to).
  -->
  <button id="btn-debug-toggle-view" style="display: none;">🧪 View 3D viewer</button>

  <!--
    Fallback: shown for two distinct reasons (see triggerFallback() in
    src/main.js) — incompatible device/browser (pre-check, before
    starting the camera) or insufficient GPU for SLAM (WebGL error
    detected during session). The text is kept generic to cover both
    cases without being specific to just one.
  -->
  <div id="fallback-viewer">
    <div class="emoji">⚠️</div>
    <h1>AR not available on this device</h1>
    <p>Your device or browser cannot run this AR experience stably. We're showing the content in a 3D view instead.</p>
    <canvas id="fallback-canvas"></canvas>
    <button id="btn-fallback-back">Back</button>
  </div>

  <!--
    8th Wall engine: classic script (not ESM) that sets window.XR8 and
    fires "xrloaded". The files come from
    node_modules/@8thwall/engine-binary/dist, copied to public/xr8/ by
    scripts/copy-xr8-assets.mjs (see postinstall).
    data-preload-chunks="slam" preloads world tracking (we don't need
    "face"). Loaded async: it may resolve before or after src/main.js
    runs, so there we wait for the "xrloaded"/XR8Promise event instead
    of assuming order.
  -->
  <script src="/xr8/xr.js" async data-preload-chunks="slam"></script>

  <!--
    XRExtras: without "async", loads and executes BEFORE the
    <script type="module"> below runs (modules are deferred). This way
    window.XRExtras already exists when src/main.js sets up the
    <a-scene> attributes. XRExtras.RuntimeError: if something throws
    an exception inside the pipeline, it shows it on screen instead of
    failing silently (crucial for debugging on a phone without console
    access).
    (We no longer load landing-page.js: it was the only use we had for
    that package, and we removed it — see comment next to <a-scene>
    above.)
  -->
  <script src="/xrextras/xrextras.js"></script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
